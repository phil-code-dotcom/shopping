<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            100: '#f5ece5',
                            200: '#e6d5c3',
                            300: '#d4b997',
                            400: '#c49a6b',
                            500: '#b07d4a',
                            600: '#8e6439',
                            700: '#6b4b2a',
                            800: '#48321c',
                            900: '#25190e',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-coffee-100 font-sans">
    <!-- Navigation -->
    <nav class="bg-coffee-800 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="#" class="text-xl font-bold">Brew Haven</a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="hover:text-coffee-300 transition">Home</a>
                    <a href="index.html" class="hover:text-coffee-300 transition">About</a>
                    <a href="index.html" class="hover:text-coffee-300 transition">Menu</a>
                    <a href="index.html" class="hover:text-coffee-300 transition">Contact</a>
                </div>

                <!-- nav search -->
                <div class="flex items-center space-x-4">
                    <button class="p-2 hover:text-coffee-300 transition relative">
                        <i id="search" class="fas fa-search"></i>
                        <!-- From Uiverse.io by emmanuelh-dev -->
                        <div id="search-field" class="hidden items-center justify-center p-5 absolute right-0">
                            <div class="rounded-lg bg-gray-200 p-5">
                                <div class="flex">
                                    <div
                                        class="flex w-20 items-center justify-center rounded-tl-lg rounded-bl-lg border-r border-gray-200 bg-white p-5">
                                        <svg viewBox="0 0 20 20" aria-hidden="true"
                                            class="pointer-events-none absolute w-5 fill-gray-500 transition">
                                            <path
                                                d="M16.72 17.78a.75.75 0 1 0 1.06-1.06l-1.06 1.06ZM9 14.5A5.5 5.5 0 0 1 3.5 9H2a7 7 0 0 0 7 7v-1.5ZM3.5 9A5.5 5.5 0 0 1 9 3.5V2a7 7 0 0 0-7 7h1.5ZM9 3.5A5.5 5.5 0 0 1 14.5 9H16a7 7 0 0 0-7-7v1.5Zm3.89 10.45 3.83 3.83 1.06-1.06-3.83-3.83-1.06 1.06ZM14.5 9a5.48 5.48 0 0 1-1.61 3.89l1.06 1.06A6.98 6.98 0 0 0 16 9h-1.5Zm-1.61 3.89A5.48 5.48 0 0 1 9 14.5V16a6.98 6.98 0 0 0 4.95-2.05l-1.06-1.06Z">
                                            </path>
                                        </svg>
                                    </div>
                                    <input id="search-input" type="text"
                                        class="w-full max-w-[160px] bg-white pl-2 text-base font-semibold outline-0"
                                        placeholder="search" >
                                    <input id="search-btn" type="button" value="Search"
                                        class="bg-coffee-800 p-2 rounded-tr-lg rounded-br-lg text-white font-semibold hover:bg-coffee-500 transition-colors">
                                </div>
                            </div>
                        </div>
                    </button>
                    <button class="p-2 hover:text-coffee-300 transition relative" id="cart-btn">
                        <i class="fas fa-shopping-cart"></i>
                        <span
                            class="absolute -top-1 -right-1 bg-coffee-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center"
                            id="cart-count">0</span>
                    </button>
                </div>
                <button class="md:hidden p-2" id="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
        <!-- Mobile menu -->
        <div class="md:hidden hidden bg-coffee-700" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="#home" class="block px-3 py-2 hover:bg-coffee-600 rounded-md">Home</a>
                <a href="#about" class="block px-3 py-2 hover:bg-coffee-600 rounded-md">About</a>
                <a href="#menu" class="block px-3 py-2 hover:bg-coffee-600 rounded-md">Menu</a>
                <a href="#contact" class="block px-3 py-2 hover:bg-coffee-600 rounded-md">Contact</a>
            </div>
        </div>
    </nav>

    
</body>
